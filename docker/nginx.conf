# Unprivileged nginx config for the Ojabook static SPA.
# Runs as UID 101 (non-root) and listens on an unprivileged port (8080),
# as provided by the nginxinc/nginx-unprivileged base image.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Defense in depth. Declared once here; no location below adds its own
    # add_header, so this is inherited everywhere.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Content-hashed assets are immutable.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The service worker must never be cached, so updates propagate.
    location = /sw.js {
        expires -1;
    }

    # SPA: serve real files, then prerendered directories, then the app shell.
    location / {
        try_files $uri $uri/ /_shell.html;
    }
}
