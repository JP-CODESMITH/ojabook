version: 2

updates:
  # The package manager is Bun (bun.lock), so use Dependabot's `bun`
  # ecosystem (Bun >= 1.1.39). The `npm` ecosystem does not read bun.lock.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      bun-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
